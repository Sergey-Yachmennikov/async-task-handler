spring:
  application:
    name: async-task-handler

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: taskuser
    password: taskpass
    hikari:
      pool-name: TaskServicePool
      # Пул должен быть больше worker.pool-size: воркеры берут соединение
      # на сохранение прогресса, плюс отдельные соединения нужны шедулеру и REST
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт исключительно Liquibase, Hibernate только сверяет маппинг
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    # Внешний листенер брокера из docker-compose: приложение, запущенное
    # с хоста, ходит на 29092. Внутри сети compose используется kafka:9092
    bootstrap-servers: localhost:29092
    consumer:
      group-id: task-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer перехватывает битый JSON и передаёт его
      # в error handler вместо того, чтобы уронить консьюмер на партиции
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.erevan.async_task_handler.dto
        # Тип берём из конфига, а не из заголовков: тогда сообщения,
        # отправленные руками через kafka-ui, десериализуются наравне с нашими
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.erevan.async_task_handler.dto.TaskRequestDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topic: tasks
    # Сообщения, которые обработать не удалось. Партиций столько же,
    # сколько в основном топике: получатель сохраняет номер партиции
    dlt-topic: tasks.DLT
    # Партиций не меньше, чем планируемых инстансов сервиса: в одной
    # consumer group партиция достаётся ровно одному консьюмеру
    partitions: 3
  recovery:
    enabled: true
    # Строго больше максимально допустимой длительности задачи (600000 мс),
    # иначе восстановление отберёт задачу у работающего над ней воркера
    stuck-timeout-ms: 900000
    interval-ms: 30000
    max-retries: 3
    batch-size: 50
  worker:
    # Участвует ли этот инстанс в выполнении задач
    enabled: true
    # Размер пула воркеров, п.3 ТЗ. I/O-bound имитация через sleep,
    # поэтому потоков имеет смысл держать больше числа ядер
    pool-size: 8
    poll-interval-ms: 1000
    progress-update-interval-ms: 500

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      # Метрики от нескольких инстансов различаются по этому тегу
      application: ${spring.application.name}

logging:
  level:
    com.erevan.async_task_handler: DEBUG
