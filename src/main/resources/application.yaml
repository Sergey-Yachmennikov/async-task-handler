spring:
  application:
    name: async-task-handler

  datasource:
    # Значения по умолчанию рассчитаны на запуск с хоста против инфраструктуры
    # из docker compose. В контейнере они переопределяются переменными окружения,
    # которые compose берёт из .env — отдельный профиль для этого не нужен
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
    username: ${DB_USERNAME:taskuser}
    password: ${DB_PASSWORD:taskpass}
    hikari:
      pool-name: TaskServicePool
      # Пул должен быть больше worker.pool-size (соединения нужны ещё шедулеру
      # и REST-слою) — связь проверяется на старте в HikariPoolSizeValidator
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    open-in-view: false
    hibernate:
      # Схему создаёт исключительно Liquibase, Hibernate только сверяет маппинг
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    # По умолчанию — внешний листенер брокера из docker compose: приложение,
    # запущенное с хоста, ходит на 29092. Контейнеры получают kafka:9092
    # через переменную окружения
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: task-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer перехватывает битый JSON и передаёт его
      # в error handler вместо того, чтобы уронить консьюмер на партиции
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.erevan.async_task_handler.dto
        # Тип берём из конфига, а не из заголовков: тогда сообщения,
        # отправленные руками через kafka-ui, десериализуются наравне с нашими
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.erevan.async_task_handler.dto.TaskRequestDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

app:
  kafka:
    topic: tasks
    # Сообщения, которые обработать не удалось. Партиций столько же,
    # сколько в основном топике: получатель сохраняет номер партиции
    dlt-topic: tasks.DLT
    # Партиций не меньше, чем планируемых инстансов сервиса: в одной
    # consumer group партиция достаётся ровно одному консьюмеру
    partitions: 3
    # Пауза перед повторной обработкой сообщения после временного сбоя
    retry-interval-ms: 1000
    retry-max-attempts: 2
  recovery:
    enabled: true
    # Задача считается зависшей, если heartbeat_at не обновлялся дольше этого
    # порога. Воркер обновляет отметку вместе с каждым сохранением прогресса
    # (раз в progress-update-interval-ms), поэтому порог может быть коротким
    # и не привязан к максимально допустимой длительности задачи
    stuck-timeout-ms: 30000
    interval-ms: 30000
    max-retries: 3
    batch-size: 50
  worker:
    # Участвует ли этот инстанс в выполнении задач
    enabled: true
    # Размер пула воркеров, п.3 ТЗ. I/O-bound имитация через sleep,
    # поэтому потоков имеет смысл держать больше числа ядер
    pool-size: 8
    poll-interval-ms: 1000
    progress-update-interval-ms: 500
    # Сколько ждать доработки текущих задач при остановке сервиса
    shutdown-timeout-ms: 30000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Подробности эндпоинта видны только авторизованным; полное раскрытие
      # всем — в dev-профиле, для прод-деплоя это лишняя утечка деталей
      show-details: when-authorized
  metrics:
    tags:
      # Метрики от нескольких инстансов различаются по этому тегу
      application: ${spring.application.name}

logging:
  level:
    com.erevan.async_task_handler: INFO
